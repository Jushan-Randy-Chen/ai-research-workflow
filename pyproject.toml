[project]
name = "airesearch"
version = "0.1.0"
description = "A research workflow template for ML/AI papers: hypothesis-driven experiment loop, verification gates with human review, reproducible runs, Overleaf via git."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Deep-learning stack. Install with `uv sync --extra torch` (pick the CUDA wheel index in [tool.uv] if needed).
torch = ["torch>=2.2"]

[project.scripts]
research-loop = "airesearch.loop.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airesearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
